<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Te Amo Hermana</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

/* CANVAS */
canvas{
    position:fixed;
    inset:0;
}

/* TEXTO CENTRAL */
.texto{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    font-size:60px;

    font-weight:bold;

    color:#9fd0ff;

    z-index:10;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 80px #66bbff;

    animation: brillo 2s infinite alternate;
}

@keyframes brillo{

    from{
        opacity:.7;
        transform:translate(-50%,-50%) scale(1);
    }

    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.03);
    }
}

/* BASE LUMINOSA */
.base{

    position:absolute;

    bottom:100px;
    left:50%;

    transform:translateX(-50%);

    width:260px;
    height:40px;

    border-radius:50%;

    background:rgba(120,200,255,.9);

    filter:blur(25px);

    box-shadow:
    0 0 30px #66bbff,
    0 0 80px #66bbff;

    animation:pulse 3s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.7;
        transform:translateX(-50%) scale(1);
    }

    50%{
        opacity:1;
        transform:translateX(-50%) scale(1.15);
    }
}

</style>
</head>

<body>

<div class="texto">
    te amo<br>hermana
</div>

<div class="base"></div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

let currentShape = "heart";

/* RANDOM */
function random(min,max){
    return Math.random()*(max-min)+min;
}

/* CORAZÓN */
function heartShape(t){

    return{

        x:16*Math.pow(Math.sin(t),3),

        y:
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    }
}

/* ROSA */
function roseShape(t){

    const r = 18*Math.sin(5*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

/* CREAR FIGURA */
function createParticles(shape){

    particles = [];

    for(let i=0;i<2600;i++){

        const t = Math.random()*Math.PI*2;

        const p = shape(t);

        particles.push({

            x:canvas.width/2,

            y:canvas.height/2,

            tx:canvas.width/2 + p.x*18,

            ty:canvas.height/2 - p.y*18,

            size:random(1,4),

            alpha:random(.4,1),

            speed:random(.01,.04),

            glow:random(8,25)
        });
    }
}

/* EXPLOSIÓN */
function explode(){

    particles.forEach(p=>{

        p.tx += random(-700,700);

        p.ty += random(-700,700);
    });
}

/* DIBUJAR */
function animate(){

    ctx.fillStyle = "rgba(0,0,0,.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{

        p.x += (p.tx-p.x)*p.speed;

        p.y += (p.ty-p.y)*p.speed;

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(120,190,255,${p.alpha})`;

        ctx.shadowBlur = p.glow;

        ctx.shadowColor = "#66bbff";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    requestAnimationFrame(animate);
}

/* SECUENCIA */

function sequence(){

    /* CORAZÓN */
    currentShape="heart";

    createParticles(heartShape);

    /* DESINTEGRAR */
    setTimeout(()=>{

        explode();

    },4500);

    /* ROSA */
    setTimeout(()=>{

        currentShape="rose";

        createParticles(roseShape);

    },8000);

    /* DESINTEGRAR */
    setTimeout(()=>{

        explode();

    },12500);

    /* CORAZÓN */
    setTimeout(()=>{

        currentShape="heart";

        createParticles(heartShape);

    },16500);
}

/* INICIO */
createParticles(heartShape);

animate();

sequence();

setInterval(sequence,21000);

/* RESPONSIVE */
window.addEventListener("resize",()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
