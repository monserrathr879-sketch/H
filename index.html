<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Te Amo Hermana 💙</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

/* CANVAS */

canvas{
    position:fixed;
    inset:0;
}

/* PANTALLA INICIAL */

.inicio{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(circle,
    rgba(10,10,30,.95),
    black);

    z-index:100;

    transition:1s;
}

.titulo{

    font-size:75px;

    text-align:center;

    color:#9fd0ff;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 100px #66bbff;

    margin-bottom:20px;

    animation: glow 2s infinite alternate;
}

.frase{

    color:white;

    font-size:25px;

    text-align:center;

    line-height:42px;

    max-width:850px;

    padding:20px;

    margin-bottom:40px;
}

.boton{

    padding:18px 55px;

    border:none;

    border-radius:50px;

    background:#66bbff;

    color:black;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

    transition:.4s;

    box-shadow:
    0 0 20px #66bbff,
    0 0 70px #66bbff;
}

.boton:hover{

    transform:scale(1.08);
}

/* TEXTO */

.texto{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    font-size:70px;

    font-weight:bold;

    color:#9fd0ff;

    z-index:20;

    opacity:0;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 100px #66bbff;

    animation: glow 2s infinite alternate;
}

@keyframes glow{

    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }
}

</style>
</head>

<body>

<!-- PANTALLA -->

<div class="inicio" id="inicio">

    <div class="titulo">
        te amo hermana 💙
    </div>

    <div class="frase">

        Gracias por cada momento,
        por cada sonrisa
        y por estar siempre conmigo.

        Pase lo que pase,
        siempre serás
        una parte importante
        de mi corazón.

    </div>

    <button class="boton" onclick="iniciar()">
        Ver Animación ✨
    </button>

</div>

<!-- TEXTO -->

<div class="texto" id="texto">
    te amo<br>hermana
</div>

<!-- AUDIO -->

<audio id="musica" loop>
    <source src="tu-cancion.mp3" type="audio/mpeg">
</audio>

<!-- CANVAS -->

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

/* RANDOM */

function random(min,max){

    return Math.random()*(max-min)+min;
}

/* ROSA REALISTA */

function roseShape(t){

    const r =
    18 * Math.sin(6*t)
    + 7 * Math.sin(3*t)
    + 4 * Math.sin(9*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

/* CORAZÓN */

function heartShape(t){

    return{

        x:
        16*Math.pow(Math.sin(t),3),

        y:
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    }
}

/* FLOR */

function flowerShape(t){

    const r =
    20*Math.sin(5*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

/* CREAR FIGURA */

function createShape(shape,scale=20){

    particles=[];

    for(let i=0;i<7000;i++){

        const t =
        Math.random()*Math.PI*2;

        const p =
        shape(t);

        particles.push({

            x:
            canvas.width/2
            + random(-900,900),

            y:
            canvas.height/2
            + random(-900,900),

            tx:
            canvas.width/2 + p.x*scale,

            ty:
            canvas.height/2 - p.y*scale,

            size:
            random(1,3.5),

            alpha:
            random(.5,1),

            speed:
            random(.01,.03),

            glow:
            random(15,35)
        });
    }
}

/* DISOLVER */

function dissolve(){

    particles.forEach(p=>{

        p.tx += random(-1200,1200);

        p.ty += random(-1200,1200);

        p.speed =
        random(.005,.02);
    });
}

/* DIBUJAR */

function animate(){

    ctx.fillStyle =
    "rgba(0,0,0,.10)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.x +=
        (p.tx-p.x)*p.speed;

        p.y +=
        (p.ty-p.y)*p.speed;

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(130,200,255,${p.alpha})`;

        ctx.shadowBlur =
        p.glow;

        ctx.shadowColor =
        "#66bbff";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    requestAnimationFrame(animate);
}

/* SECUENCIA */

function sequence(){

    /* ROSA */

    createShape(
        roseShape,
        24
    );

    /* DISOLVER */

    setTimeout(()=>{

        dissolve();

    },5000);

    /* CORAZÓN */

    setTimeout(()=>{

        createShape(
            heartShape,
            20
        );

    },9000);

    /* DISOLVER */

    setTimeout(()=>{

        dissolve();

    },14000);

    /* FLOR */

    setTimeout(()=>{

        createShape(
            flowerShape,
            24
        );

    },18000);

    /* DISOLVER */

    setTimeout(()=>{

        dissolve();

    },23000);

    /* ROSA FINAL */

    setTimeout(()=>{

        createShape(
            roseShape,
            24
        );

    },27000);
}

/* INICIAR */

function iniciar(){

    document.getElementById(
        "inicio"
    ).style.opacity = "0";

    setTimeout(()=>{

        document.getElementById(
            "inicio"
        ).style.display = "none";

    },1000);

    document.getElementById(
        "texto"
    ).style.opacity = "1";

    document.getElementById(
        "musica"
    ).play();

    createShape(
        roseShape,
        24
    );

    animate();

    sequence();

    setInterval(sequence,32000);
}

/* RESPONSIVE */

addEventListener("resize",()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

</script>

</body>
</html>
