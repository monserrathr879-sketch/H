<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Te Amo Hermana</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

/* PANTALLA INICIAL */

.inicio{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(circle,
    rgba(20,20,40,.95),
    black);

    z-index:100;

    transition:1s;
}

.titulo{

    font-size:75px;

    color:#9fd0ff;

    text-align:center;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 90px #66bbff;

    margin-bottom:20px;
}

.frase{

    color:white;

    font-size:25px;

    max-width:800px;

    text-align:center;

    line-height:45px;

    padding:20px;

    margin-bottom:40px;
}

.boton{

    padding:18px 50px;

    border:none;

    border-radius:50px;

    background:#66bbff;

    color:black;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    transition:.4s;

    box-shadow:
    0 0 20px #66bbff,
    0 0 60px #66bbff;
}

.boton:hover{

    transform:scale(1.08);
}

/* TEXTO CENTRAL */

.texto{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    font-size:65px;

    font-weight:bold;

    color:#9fd0ff;

    z-index:20;

    opacity:0;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 80px #66bbff;

    animation: glow 2s infinite alternate;
}

@keyframes glow{

    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }
}

/* BASE */

.base{

    position:absolute;

    bottom:100px;

    left:50%;

    transform:translateX(-50%);

    width:260px;

    height:40px;

    border-radius:50%;

    background:#7ec8ff;

    filter:blur(25px);

    opacity:0;

    box-shadow:
    0 0 40px #66bbff,
    0 0 100px #66bbff;
}

/* IMÁGENES */

.imagenes{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:40px;

    opacity:0;

    transition:2s;

    z-index:30;

    pointer-events:none;
}

.foto{

    width:280px;

    height:400px;

    object-fit:cover;

    border-radius:25px;

    border:3px solid #8ec5ff;

    box-shadow:
    0 0 20px #66bbff,
    0 0 60px #66bbff,
    0 0 120px #66bbff;

    opacity:0;
}

.foto1{

    transform:
    rotate(-8deg)
    scale(.7);
}

.foto2{

    transform:
    rotate(8deg)
    scale(.7);
}

.foto.visible{

    opacity:1;

    transform:
    rotate(0deg)
    scale(1);

    transition:2s;
}

/* CANVAS */

canvas{
    position:fixed;
    inset:0;
}

</style>
</head>

<body>

<!-- PANTALLA -->

<div class="inicio" id="inicio">

    <div class="titulo">
        te amo hermana 💙
    </div>

    <div class="frase">

        Gracias por estar siempre conmigo.

        Por las risas,
        los momentos felices,
        y por nunca dejarme solo.

        Pase lo que pase,
        siempre tendrás un lugar especial
        en mi corazón.

    </div>

    <button class="boton" onclick="iniciar()">
        Ver Animación ✨
    </button>

</div>

<!-- TEXTO -->

<div class="texto" id="texto">
    te amo<br>hermana
</div>

<!-- BASE -->

<div class="base" id="base"></div>

<!-- IMÁGENES -->

<div class="imagenes" id="imagenes">

    <!-- CAMBIA AQUÍ LAS FOTOS -->

    <img
    src="foto1.jpg"
    class="foto foto1"
    id="foto1">

    <img
    src="foto2.jpg"
    class="foto foto2"
    id="foto2">

</div>

<!-- AUDIO -->

<audio id="musica" loop>
    <source src="New West - Those Eyes (Lyrics).mp3" type="audio/mpeg">
</audio>

<!-- CANVAS -->

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

/* RANDOM */

function random(min,max){

    return Math.random()*(max-min)+min;
}

/* FORMAS */

function heartShape(t){

    return{

        x:
        16*Math.pow(Math.sin(t),3),

        y:
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    }
}

function flowerShape(t){

    const r =
    20*Math.sin(6*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

function roseShape(t){

    const r =
    24*Math.sin(5*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

/* CREAR FIGURA */

function createShape(shape,scale=18){

    particles=[];

    for(let i=0;i<3200;i++){

        const t =
        Math.random()*Math.PI*2;

        const p =
        shape(t);

        particles.push({

            x:canvas.width/2,

            y:canvas.height/2,

            tx:
            canvas.width/2 + p.x*scale,

            ty:
            canvas.height/2 - p.y*scale,

            size:
            random(1,4),

            alpha:
            random(.4,1),

            speed:
            random(.01,.04),

            glow:
            random(10,35)
        });
    }
}

/* EXPLOSIÓN */

function explode(){

    particles.forEach(p=>{

        p.tx += random(-900,900);

        p.ty += random(-900,900);
    });
}

/* DIBUJAR */

function animate(){

    ctx.fillStyle =
    "rgba(0,0,0,.12)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.x +=
        (p.tx-p.x)*p.speed;

        p.y +=
        (p.ty-p.y)*p.speed;

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(120,190,255,${p.alpha})`;

        ctx.shadowBlur =
        p.glow;

        ctx.shadowColor =
        "#66bbff";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    requestAnimationFrame(animate);
}

/* MOSTRAR IMÁGENES */

function mostrarFotos(){

    const imagenes =
    document.getElementById(
        "Screenshot_2026-05-09-20-41-35-094_com.google.android.apps.photos.jpg"
    );

    imagenes.style.opacity = "1";

    document.getElementById(
        "Screenshot_2026-05-09-20-43-46-679_com.google.android.apps.photos.jpg"
    ).classList.add(
        "visible"
    );

    setTimeout(()=>{

        document.getElementById(
            "Screenshot_2026-05-09-20-43-49-913_com.google.android.apps.photos.jpg"
        ).classList.add(
            "visible"
        );

    },1500);
}

/* OCULTAR */

function ocultarFotos(){

    document.getElementById(
        "imagenes"
    ).style.opacity = "0";
}

/* SECUENCIA */

function sequence(){

    /* CORAZÓN */

    createShape(
        heartShape,
        18
    );

    /* EXPLOSIÓN */

    setTimeout(()=>{

        explode();

    },5000);

    /* FLOR */

    setTimeout(()=>{

        createShape(
            flowerShape,
            22
        );

    },9000);

    /* MOSTRAR FOTOS */

    setTimeout(()=>{

        mostrarFotos();

    },13000);

    /* ROSA */

    setTimeout(()=>{

        createShape(
            roseShape,
            24
        );

    },17000);

    /* OCULTAR FOTOS */

    setTimeout(()=>{

        ocultarFotos();

    },23000);

    /* EXPLOSIÓN */

    setTimeout(()=>{

        explode();

    },25000);

    /* CORAZÓN FINAL */

    setTimeout(()=>{

        createShape(
            heartShape,
            18
        );

    },29000);
}

/* INICIAR */

function iniciar(){

    document.getElementById(
        "inicio"
    ).style.opacity = "0";

    setTimeout(()=>{

        document.getElementById(
            "inicio"
        ).style.display = "none";

    },1000);

    document.getElementById(
        "texto"
    ).style.opacity = "1";

    document.getElementById(
        "base"
    ).style.opacity = "1";

    /* MÚSICA */

    document.getElementById(
        "musica"
    ).play();

    /* ANIMACIÓN */

    createShape(
        heartShape,
        18
    );

    animate();

    sequence();

    setInterval(sequence,34000);
}

/* RESPONSIVE */

addEventListener("resize",()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

</script>

</body>
</html>
