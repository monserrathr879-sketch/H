<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Te Amo Hermana</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

canvas{
    position:fixed;
    inset:0;
}

/* TEXTO */
.texto{

    position:absolute;

    top:10%;

    width:100%;

    text-align:center;

    font-size:70px;

    font-weight:bold;

    color:#8ec5ff;

    text-shadow:
    0 0 10px #8ec5ff,
    0 0 20px #8ec5ff,
    0 0 40px #8ec5ff,
    0 0 80px #8ec5ff;

    opacity:0;

    animation: aparecerTexto 2s forwards;
}

@keyframes aparecerTexto{

    from{
        opacity:0;
        transform:translateY(-30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* BRILLO BASE */
.base{

    position:absolute;

    bottom:120px;
    left:50%;

    transform:translateX(-50%);

    width:220px;
    height:35px;

    border-radius:50%;

    background:rgba(120,200,255,.9);

    filter:blur(20px);

    box-shadow:
    0 0 30px #66bbff,
    0 0 80px #66bbff;

    animation:pulse 3s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:translateX(-50%) scale(1);
        opacity:.8;
    }

    50%{
        transform:translateX(-50%) scale(1.2);
        opacity:1;
    }
}

</style>
</head>

<body>

<div class="texto">te amo hermana</div>

<div class="base"></div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

let mode = "heart";

/* MODOS:
heart
explode
flower
*/

function random(min,max){
    return Math.random()*(max-min)+min;
}

/* CORAZÓN */
function heartShape(t){

    return {

        x:16*Math.pow(Math.sin(t),3),

        y:
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    }
}

/* FLOR */
function flowerShape(t){

    const r = 12 * Math.sin(6*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

/* CREAR PARTÍCULAS */
function createShape(shape){

    particles = [];

    for(let i=0;i<2200;i++){

        const t = Math.random()*Math.PI*2;

        const p = shape(t);

        particles.push({

            x:canvas.width/2,

            y:canvas.height/2,

            tx:canvas.width/2 + p.x*22,

            ty:canvas.height/2 - p.y*22,

            size:random(1,4),

            alpha:random(.4,1),

            speed:random(.01,.04),

            glow:random(10,30)
        });
    }
}

/* EXPLOSIÓN */
function explodeParticles(){

    particles.forEach(p=>{

        p.tx += random(-500,500);

        p.ty += random(-500,500);
    });
}

/* DIBUJAR */
function draw(){

    ctx.fillStyle = "rgba(0,0,0,.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{

        p.x += (p.tx-p.x)*p.speed;

        p.y += (p.ty-p.y)*p.speed;

        ctx.beginPath();

        ctx.fillStyle = `rgba(120,190,255,${p.alpha})`;

        ctx.shadowBlur = p.glow;

        ctx.shadowColor = "#66bbff";

        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);

        ctx.fill();
    });

    requestAnimationFrame(draw);
}

/* SECUENCIA */

function sequence(){

    /* CORAZÓN */
    mode="heart";

    createShape(heartShape);

    /* EXPLOSIÓN */
    setTimeout(()=>{

        mode="explode";

        explodeParticles();

    },5000);

    /* FLOR */
    setTimeout(()=>{

        mode="flower";

        createShape(flowerShape);

    },9000);

    /* OTRA EXPLOSIÓN */
    setTimeout(()=>{

        explodeParticles();

    },14000);

    /* REGRESA CORAZÓN */
    setTimeout(()=>{

        createShape(heartShape);

    },18000);
}

/* INICIO */
createShape(heartShape);

draw();

sequence();

/* LOOP */
setInterval(sequence,22000);

/* RESPONSIVE */
window.addEventListener("resize",()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
