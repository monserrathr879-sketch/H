<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Te quiero hermana! ❤️</title>

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- TAILWIND -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">

<script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                primary: '#6366F1',
                accent: '#EC4899',
                dark: '#1F2937',
            },
            fontFamily: {
                poppins: ['Poppins', 'sans-serif'],
            },
        }
    }
}
</script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    overflow:hidden;
    min-height:100vh;
    background:linear-gradient(135deg,#eef2ff,#f5d0fe,#ffe4e6);
    display:flex;
    flex-direction:column;
}

/* SOMBRAS */
.sombra-suave{
    box-shadow:0 8px 32px rgba(0,0,0,0.1);
}

.texto-sombra{
    text-shadow:0 2px 4px rgba(0,0,0,0.15);
}

/* LATIDO */
.latido{
    animation:latido 1s infinite;
}

@keyframes latido{
    0%{transform:scale(1);}
    25%{transform:scale(1.12);}
    50%{transform:scale(1);}
    75%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

/* APARECER */
.aparecer{
    animation:aparecer 1s ease;
}

@keyframes aparecer{
    from{
        opacity:0;
        transform:scale(0.7);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* CORAZONES */
.corazon{
    position:absolute;
    color:#EC4899;
    font-size:35px;
    opacity:0;
    animation:flotar 2s linear forwards;
}

@keyframes flotar{
    0%{
        transform:translateY(0) scale(0.3) rotate(0deg);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-500px) scale(1.2) rotate(360deg);
        opacity:0;
    }
}

/* BRILLO BOTÓN */
.brillo:hover{
    box-shadow:0 0 25px rgba(236,72,153,0.7);
}

/* FONDO */
.fondo-animado{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top left, rgba(255,255,255,0.5), transparent 30%),
    radial-gradient(circle at bottom right, rgba(255,255,255,0.4), transparent 30%);
    z-index:-1;
}
</style>
</head>

<body>

<div class="fondo-animado"></div>

<!-- AUDIO -->
<audio id="musicaFondo" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-love-piano-1206.mp3" type="audio/mpeg">
</audio>

<!-- HEADER -->
<header class="bg-white/60 backdrop-blur-md shadow-md py-5 border-b border-white/30">
    <h1 class="text-center text-3xl font-bold text-dark flex items-center justify-center gap-3 texto-sombra">
        <i class="fa fa-heart text-accent latido"></i>
        Mensaje Especial
    </h1>

    <p class="text-center text-gray-600 mt-2">
        Un regalo con mucho cariño ❤️
    </p>
</header>

<!-- MAIN -->
<main class="flex-grow flex items-center justify-center px-5 relative">

    <!-- PANTALLA INICIO -->
    <div id="pantallaInicio"
    class="bg-white/80 backdrop-blur-lg rounded-3xl sombra-suave p-10 w-full max-w-md text-center aparecer border border-white/30">

        <i class="fa fa-heart text-accent text-8xl latido mb-8"></i>

        <h2 class="text-3xl font-bold text-dark mb-4 texto-sombra">
            ¿Quieres ver el mensaje?
        </h2>

        <p class="text-gray-600 mb-8">
            Presiona el botón para abrir la sorpresa ✨
        </p>

        <button onclick="mostrarMensaje()"
        class="brillo w-full bg-gradient-to-r from-primary to-accent hover:from-accent hover:to-primary text-white py-4 rounded-2xl text-lg font-semibold transition-all duration-300 hover:scale-105 active:scale-95">

            <i class="fa fa-paper-plane-o mr-2"></i>
            Abrir Mensaje

        </button>
    </div>

    <!-- PANTALLA MENSAJE -->
    <div id="pantallaMensaje"
    class="hidden absolute inset-0 flex items-center justify-center px-5">

        <!-- CONTENEDOR -->
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-10 max-w-md w-full text-center sombra-suave relative overflow-hidden aparecer">

            <!-- CORAZONES -->
            <div id="corazonesAnimados"
            class="absolute inset-0 pointer-events-none overflow-hidden"></div>

            <!-- ICONO -->
            <div class="w-36 h-36 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center mx-auto mb-8 shadow-xl">
                <i class="fa fa-heart text-white text-7xl latido"></i>
            </div>

            <!-- TEXTO -->
            <h2 class="text-5xl font-bold text-accent texto-sombra mb-6 latido">
                ¡Te quiero hermana! ❤️
            </h2>

            <p class="text-gray-700 text-lg leading-relaxed mb-8">
                Eres una persona muy especial para mí 🫂✨
                <br><br>
                Gracias por siempre estar conmigo.
            </p>

            <!-- BOTÓN -->
            <button onclick="volverInicio()"
            class="brillo w-full bg-gradient-to-r from-primary to-accent text-white py-4 rounded-2xl text-lg font-semibold hover:scale-105 active:scale-95 transition-all duration-300">

                Volver

            </button>

        </div>

    </div>

</main>

<!-- FOOTER -->
<footer class="bg-white/50 backdrop-blur-md border-t border-white/30 py-4 text-center text-gray-600 text-sm">
    © 2026 | Hecho con mucho cariño ❤️
</footer>

<script>

// CREAR CORAZONES
function crearCorazon(){

    const contenedor = document.getElementById('corazonesAnimados');

    const corazon = document.createElement('i');

    corazon.className = 'fa fa-heart corazon';

    corazon.style.left = Math.random() * 100 + '%';

    corazon.style.bottom = '-20px';

    corazon.style.fontSize = (20 + Math.random() * 30) + 'px';

    contenedor.appendChild(corazon);

    setTimeout(() => {
        corazon.remove();
    }, 2000);
}

// MOSTRAR MENSAJE
function mostrarMensaje(){

    document.getElementById('pantallaInicio').classList.add('hidden');

    document.getElementById('pantallaMensaje').classList.remove('hidden');

    // MÚSICA
    const musica = document.getElementById('musicaFondo');

    musica.volume = 0.5;

    musica.play().catch(error => {
        console.log(error);
    });

    // CORAZONES CONTINUOS
    window.intervaloCorazones = setInterval(() => {
        crearCorazon();
    }, 200);
}

// VOLVER
function volverInicio(){

    document.getElementById('pantallaMensaje').classList.add('hidden');

    document.getElementById('pantallaInicio').classList.remove('hidden');

    // DETENER CORAZONES
    clearInterval(window.intervaloCorazones);

    // DETENER MÚSICA
    const musica = document.getElementById('musicaFondo');

    musica.pause();

    musica.currentTime = 0;
}

</script>

</body>
</html>
