<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Te Amo Hermana 💙</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

/* CANVAS */

canvas{
    position:fixed;
    inset:0;
}

/* PANTALLA INICIAL */

.inicio{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(circle,
    rgba(15,15,35,.95),
    black);

    z-index:100;

    transition:1s;
}

.titulo{

    font-size:75px;

    text-align:center;

    color:#9fd0ff;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 80px #66bbff;

    margin-bottom:25px;

    animation: brillo 2s infinite alternate;
}

.frase{

    color:white;

    font-size:25px;

    text-align:center;

    line-height:42px;

    max-width:850px;

    padding:20px;

    margin-bottom:45px;
}

.boton{

    padding:18px 55px;

    border:none;

    border-radius:50px;

    background:#66bbff;

    color:black;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    transition:.4s;

    box-shadow:
    0 0 20px #66bbff,
    0 0 70px #66bbff;
}

.boton:hover{

    transform:scale(1.08);
}

/* TEXTO CENTRAL */

.texto{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    font-size:70px;

    font-weight:bold;

    color:#9fd0ff;

    z-index:20;

    opacity:0;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 100px #66bbff;

    animation: brillo 2s infinite alternate;
}

@keyframes brillo{

    from{
        opacity:.75;
    }

    to{
        opacity:1;
    }
}

/* IMÁGENES */

.imagenes{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:50px;

    opacity:0;

    transition:2s;

    z-index:30;

    pointer-events:none;
}

.foto{

    width:280px;

    height:400px;

    object-fit:cover;

    border-radius:25px;

    border:3px solid #8ec5ff;

    box-shadow:
    0 0 25px #66bbff,
    0 0 70px #66bbff,
    0 0 120px #66bbff;

    opacity:0;
}

.foto1{

    transform:
    rotate(-8deg)
    scale(.7);
}

.foto2{

    transform:
    rotate(8deg)
    scale(.7);
}

.foto.visible{

    opacity:1;

    transform:
    rotate(0deg)
    scale(1);

    transition:2s;
}

</style>
</head>

<body>

<!-- PANTALLA INICIAL -->

<div class="inicio" id="inicio">

    <div class="titulo">
        te amo hermana 💙
    </div>

    <div class="frase">

        Gracias por estar siempre conmigo,
        por las risas,
        los momentos felices
        y por nunca dejarme solo.

        Pase lo que pase,
        siempre tendrás
        un lugar especial
        en mi corazón.

    </div>

    <button class="boton" onclick="iniciar()">
        Ver Animación ✨
    </button>

</div>

<!-- TEXTO -->

<div class="texto" id="texto">
    te amo<br>hermana
</div>

<!-- IMÁGENES -->

<div class="imagenes" id="imagenes">

    <!-- CAMBIA AQUÍ TUS FOTOS -->

    <img
    src="Screenshot_2026-05-09-20-43-46-679_com.google.android.apps.photos.jpg"
    class="foto foto1"
    id="foto1">

    <img
    src="Screenshot_2026-05-09-20-43-49-913_com.google.android.apps.photos.jpg"
    class="foto foto2"
    id="foto2">

</div>

<!-- AUDIO -->

<audio id="musica" loop>
    <source src="New West - Those Eyes (Lyrics).mp3" type="audio/mpeg">
</audio>

<!-- CANVAS -->

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

/* RANDOM */

function random(min,max){

    return Math.random()*(max-min)+min;
}

/* ROSA */

function roseShape(t){

    const r =
    18*Math.sin(6*t)
    + 8*Math.sin(3*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

/* CORAZÓN */

function heartShape(t){

    return{

        x:
        16*Math.pow(Math.sin(t),3),

        y:
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    }
}

/* FLOR */

function flowerShape(t){

    const r =
    22*Math.sin(5*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

/* CREAR FIGURAS */

function createShape(shape,scale=18){

    particles=[];

    for(let i=0;i<5000;i++){

        const t =
        Math.random()*Math.PI*2;

        const p =
        shape(t);

        particles.push({

            x:canvas.width/2,

            y:canvas.height/2,

            tx:
            canvas.width/2 + p.x*scale,

            ty:
            canvas.height/2 - p.y*scale,

            size:
            random(1,3.5),

            alpha:
            random(.5,1),

            speed:
            random(.01,.03),

            glow:
            random(10,35)
        });
    }
}

/* EXPLOSIÓN */

function explode(){

    particles.forEach(p=>{

        p.tx += random(-1000,1000);

        p.ty += random(-1000,1000);
    });
}

/* DIBUJAR */

function animate(){

    ctx.fillStyle =
    "rgba(0,0,0,.10)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.x +=
        (p.tx-p.x)*p.speed;

        p.y +=
        (p.ty-p.y)*p.speed;

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(120,190,255,${p.alpha})`;

        ctx.shadowBlur =
        p.glow;

        ctx.shadowColor =
        "#66bbff";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    requestAnimationFrame(animate);
}

/* MOSTRAR FOTOS */

function mostrarFotos(){

    const imagenes =
    document.getElementById(
        "imagenes"
    );

    imagenes.style.opacity = "1";

    document.getElementById(
        "foto1"
    ).classList.add(
        "visible"
    );

    setTimeout(()=>{

        document.getElementById(
            "foto2"
        ).classList.add(
            "visible"
        );

    },1500);
}

/* OCULTAR FOTOS */

function ocultarFotos(){

    document.getElementById(
        "imagenes"
    ).style.opacity = "0";
}

/* SECUENCIA */

function sequence(){

    /* ROSA */

    createShape(
        roseShape,
        22
    );

    /* EXPLOSIÓN */

    setTimeout(()=>{

        explode();

    },6000);

    /* CORAZÓN */

    setTimeout(()=>{

        createShape(
            heartShape,
            18
        );

    },10000);

    /* MOSTRAR FOTOS */

    setTimeout(()=>{

        mostrarFotos();

    },14000);

    /* FLOR */

    setTimeout(()=>{

        createShape(
            flowerShape,
            22
        );

    },18000);

    /* OCULTAR FOTOS */

    setTimeout(()=>{

        ocultarFotos();

    },24000);

    /* EXPLOSIÓN */

    setTimeout(()=>{

        explode();

    },26000);

    /* CORAZÓN FINAL */

    setTimeout(()=>{

        createShape(
            heartShape,
            18
        );

    },30000);
}

/* INICIAR */

function iniciar(){

    document.getElementById(
        "inicio"
    ).style.opacity = "0";

    setTimeout(()=>{

        document.getElementById(
            "inicio"
        ).style.display = "none";

    },1000);

    document.getElementById(
        "texto"
    ).style.opacity = "1";

    document.getElementById(
        "musica"
    ).play();

    createShape(
        roseShape,
        22
    );

    animate();

    sequence();

    setInterval(sequence,35000);
}

/* RESPONSIVE */

addEventListener("resize",()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

</script>

</body>
</html>
