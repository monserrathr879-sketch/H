<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Te Amo Hermana</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

/* PANTALLA INICIAL */

.inicio{

    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle,
    rgba(20,20,40,.9),
    black);

    z-index:20;

    transition:1s;
}

.titulo{

    font-size:70px;

    font-weight:bold;

    color:#9fd0ff;

    text-align:center;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 80px #66bbff;

    margin-bottom:20px;

    animation: glow 2s infinite alternate;
}

.frase{

    color:white;

    font-size:24px;

    max-width:700px;

    text-align:center;

    line-height:40px;

    opacity:.9;

    margin-bottom:50px;

    padding:20px;
}

.boton{

    padding:18px 45px;

    border:none;

    border-radius:50px;

    background:#66bbff;

    color:black;

    font-size:25px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 20px #66bbff,
    0 0 50px #66bbff;

    transition:.4s;
}

.boton:hover{

    transform:scale(1.08);

    box-shadow:
    0 0 30px #66bbff,
    0 0 80px #66bbff;
}

@keyframes glow{

    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }
}

/* TEXTO CENTRAL */

.texto{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    font-size:65px;

    font-weight:bold;

    color:#9fd0ff;

    z-index:10;

    opacity:0;

    text-shadow:
    0 0 10px #66bbff,
    0 0 20px #66bbff,
    0 0 40px #66bbff,
    0 0 80px #66bbff;

    animation: glow 2s infinite alternate;
}

/* BASE */

.base{

    position:absolute;

    bottom:100px;
    left:50%;

    transform:translateX(-50%);

    width:260px;
    height:40px;

    border-radius:50%;

    background:#7ec8ff;

    filter:blur(25px);

    opacity:0;

    box-shadow:
    0 0 40px #66bbff,
    0 0 100px #66bbff;
}

/* CANVAS */

canvas{
    position:fixed;
    inset:0;
}

</style>
</head>

<body>

<!-- PANTALLA INICIAL -->

<div class="inicio" id="inicio">

    <div class="titulo">
        te amo hermana 💙
    </div>

    <div class="frase">
    
        Eres una de las personas más importantes de mi vida,
        y aunque a veces no lo diga mucho,
        siempre voy a cuidarte y quererte con todo mi corazón.
    </div>

    <button class="boton" onclick="iniciar()">
        Ver Animación ✨
    </button>

</div>

<!-- TEXTO -->

<div class="texto" id="texto">
    te amo<br>hermana
</div>

<!-- BASE -->

<div class="base" id="base"></div>

<!-- MÚSICA -->
<!-- CAMBIA EL ARCHIVO MP3 -->

<audio id="musica" loop>
    <source src="New West - Those Eyes (Lyrics).mp3" type="audio/mpeg">
</audio>

<!-- CANVAS -->

<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

/* RANDOM */

function random(min,max){

    return Math.random()*(max-min)+min;
}

/* FORMAS */

function heartShape(t){

    return{

        x:
        16*Math.pow(Math.sin(t),3),

        y:
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    }
}

function flowerShape(t){

    const r =
    20*Math.sin(6*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

function roseShape(t){

    const r =
    24*Math.sin(5*t);

    return{

        x:r*Math.cos(t),

        y:r*Math.sin(t)
    }
}

/* CREAR FIGURAS */

function createShape(shape,scale=18){

    particles=[];

    for(let i=0;i<3200;i++){

        const t =
        Math.random()*Math.PI*2;

        const p =
        shape(t);

        particles.push({

            x:canvas.width/2,

            y:canvas.height/2,

            tx:
            canvas.width/2 + p.x*scale,

            ty:
            canvas.height/2 - p.y*scale,

            size:
            random(1,4),

            alpha:
            random(.4,1),

            speed:
            random(.01,.04),

            glow:
            random(10,35)
        });
    }
}

/* EXPLOSIÓN */

function explode(){

    particles.forEach(p=>{

        p.tx += random(-900,900);

        p.ty += random(-900,900);
    });
}

/* DIBUJAR */

function animate(){

    ctx.fillStyle =
    "rgba(0,0,0,.12)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{

        p.x +=
        (p.tx-p.x)*p.speed;

        p.y +=
        (p.ty-p.y)*p.speed;

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(120,190,255,${p.alpha})`;

        ctx.shadowBlur =
        p.glow;

        ctx.shadowColor =
        "#66bbff";

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    requestAnimationFrame(animate);
}

/* SECUENCIA */

function sequence(){

    createShape(
        heartShape,
        18
    );

    setTimeout(()=>{

        explode();

    },5000);

    setTimeout(()=>{

        createShape(
            flowerShape,
            22
        );

    },9000);

    setTimeout(()=>{

        explode();

    },14000);

    setTimeout(()=>{

        createShape(
            roseShape,
            24
        );

    },18000);

    setTimeout(()=>{

        explode();

    },24000);

    setTimeout(()=>{

        createShape(
            heartShape,
            18
        );

    },29000);
}

/* INICIAR */

function iniciar(){

    document.getElementById(
        "inicio"
    ).style.opacity = "0";

    setTimeout(()=>{

        document.getElementById(
            "inicio"
        ).style.display = "none";

    },1000);

    document.getElementById(
        "texto"
    ).style.opacity = "1";

    document.getElementById(
        "base"
    ).style.opacity = "1";

    /* REPRODUCIR MÚSICA */

    const musica =
    document.getElementById(
        "musica"
    );

    musica.play();

    /* ANIMACIÓN */

    createShape(
        heartShape,
        18
    );

    animate();

    sequence();

    setInterval(sequence,34000);
}

/* RESPONSIVE */

addEventListener("resize",()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

</script>

</body>
</html>
