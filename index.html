<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

canvas{
    position:fixed;
    top:0;
    left:0;
}

.texto{
    position:absolute;
    top:8%;
    width:100%;
    text-align:center;

    font-size:70px;
    font-weight:bold;

    color:#66aaff;

    text-shadow:
    0 0 10px #66aaff,
    0 0 20px #66aaff,
    0 0 40px #66aaff,
    0 0 80px #66aaff;

    animation: brillo 2s infinite alternate;
}

@keyframes brillo{

    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }
}

</style>
</head>
<body>

<div class="texto">I Love You</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particles = [];

/* CREAR FORMA DE CORAZÓN */
function heart(t){

    const x = 16 * Math.pow(Math.sin(t),3);

    const y =
    13 * Math.cos(t)
    -5 * Math.cos(2*t)
    -2 * Math.cos(3*t)
    -Math.cos(4*t);

    return {
        x:x,
        y:y
    }
}

/* GENERAR PARTÍCULAS */
for(let i=0;i<2000;i++){

    const t = Math.random() * Math.PI * 2;

    const punto = heart(t);

    particles.push({

        x: canvas.width/2 + punto.x * 22 + (Math.random()-0.5)*20,

        y: canvas.height/2 + -punto.y * 22 + (Math.random()-0.5)*20,

        size: Math.random()*3,

        alpha: Math.random(),

        speed: Math.random()*0.5 + 0.2
    });
}

/* BASE LUMINOSA */
function drawBase(){

    const gradient = ctx.createRadialGradient(
        canvas.width/2,
        canvas.height/2 + 320,
        10,
        canvas.width/2,
        canvas.height/2 + 320,
        120
    );

    gradient.addColorStop(0,"rgba(120,200,255,1)");
    gradient.addColorStop(.3,"rgba(120,200,255,.8)");
    gradient.addColorStop(1,"rgba(120,200,255,0)");

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.ellipse(
        canvas.width/2,
        canvas.height/2 + 320,
        140,
        35,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* ANIMACIÓN */
function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBase();

    particles.forEach(p=>{

        p.alpha += 0.01 * p.speed;

        if(p.alpha >= 1){
            p.alpha = 0.2;
        }

        ctx.beginPath();

        ctx.fillStyle = `rgba(120,190,255,${p.alpha})`;

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#66bbff";

        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);

        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

/* RESPONSIVE */
window.addEventListener("resize",()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
